<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img"><defs><marker id="a-34c9b9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34c9b9"/></marker><marker id="b-34c9b9" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#34c9b9"/></marker><marker id="a-f5c842" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5c842"/></marker><marker id="b-f5c842" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#f5c842"/></marker><marker id="a-2563eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="b-2563eb" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#2563eb"/></marker><marker id="a-2c313a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c313a"/></marker><marker id="b-2c313a" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#2c313a"/></marker><marker id="a-9aa0a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa0a8"/></marker><marker id="b-9aa0a8" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#9aa0a8"/></marker></defs><rect width="1000" height="470" rx="14" fill="#0b0e13"/><text x="30" y="42" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="600" fill="#e5e7eb" text-anchor="start">RS485-Verdrahtung — zwei unabhängige Busse</text><text x="30" y="66" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="400" fill="#9aa0a8" text-anchor="start">Auto-Direction-Transceiver (kein DE/RE-Pin), UART0 bleibt die Konsole</text><rect x="40" y="110" width="250" height="240" rx="12" fill="#1f2329" stroke="#2563eb" stroke-width="2"/><text x="165" y="142" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#e5e7eb" text-anchor="middle">ESP32-P4</text><text x="165" y="162" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#9aa0a8" text-anchor="middle">GPIO-Header</text><rect x="58" y="186" width="214" height="26" rx="6" fill="#161a21" stroke="#2c313a" stroke-width="1"/><text x="70" y="204" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="400" fill="#e5e7eb" text-anchor="start">UART1  TX  GPIO 52</text><rect x="58" y="216" width="214" height="26" rx="6" fill="#161a21" stroke="#2c313a" stroke-width="1"/><text x="70" y="234" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="400" fill="#e5e7eb" text-anchor="start">UART1  RX  GPIO 51</text><rect x="58" y="262" width="214" height="26" rx="6" fill="#161a21" stroke="#2c313a" stroke-width="1"/><text x="70" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="400" fill="#e5e7eb" text-anchor="start">UART2  TX  GPIO 50</text><rect x="58" y="292" width="214" height="26" rx="6" fill="#161a21" stroke="#2c313a" stroke-width="1"/><text x="70" y="310" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="400" fill="#e5e7eb" text-anchor="start">UART2  RX  GPIO 49</text><text x="165" y="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9aa0a8" text-anchor="middle">3V3 · GND gemeinsam</text><text x="330" y="114" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#34c9b9" text-anchor="start">Bus A — Master</text><rect x="330" y="126" width="190" height="86" rx="10" fill="#161a21" stroke="#2c313a" stroke-width="1.5"/><text x="425" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#e5e7eb" text-anchor="middle">MAX485 / MAX3485</text><text x="425" y="180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9aa0a8" text-anchor="middle">A / B  120 Ω</text><rect x="600" y="126" width="360" height="86" rx="10" fill="#161a21" stroke="#34c9b9" stroke-width="2"/><text x="620" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#e5e7eb" text-anchor="start">Deye  Modbus-Port</text><text x="620" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#9aa0a8" text-anchor="start">liest Reg 588 (SoC) und Reg 590 (Akku-Leistung)</text><text x="620" y="191" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#9aa0a8" text-anchor="start">schreibt die Steuer-Register per FC16</text><line x1="292" y1="169" x2="326" y2="169" stroke="#34c9b9" stroke-width="2" stroke-linecap="round" marker-end="url(#a-34c9b9)" marker-start="url(#b-34c9b9)"/><line x1="522" y1="169" x2="596" y2="169" stroke="#34c9b9" stroke-width="2" stroke-linecap="round" marker-end="url(#a-34c9b9)" marker-start="url(#b-34c9b9)"/><text x="330" y="264" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#f5c842" text-anchor="start">Bus B — Slave</text><rect x="330" y="276" width="190" height="86" rx="10" fill="#161a21" stroke="#2c313a" stroke-width="1.5"/><text x="425" y="308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#e5e7eb" text-anchor="middle">MAX485 / MAX3485</text><text x="425" y="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#9aa0a8" text-anchor="middle">A / B  120 Ω</text><rect x="600" y="276" width="360" height="86" rx="10" fill="#161a21" stroke="#f5c842" stroke-width="2"/><text x="620" y="302" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#e5e7eb" text-anchor="start">Deye  Zähler-Port</text><text x="620" y="324" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#9aa0a8" text-anchor="start">antwortet als Eastron SDM630 (float32, FC03/FC04)</text><text x="620" y="341" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#9aa0a8" text-anchor="start">meldet (echter Netzbezug − Sollwert)</text><line x1="292" y1="319" x2="326" y2="319" stroke="#f5c842" stroke-width="2" stroke-linecap="round" marker-end="url(#a-f5c842)" marker-start="url(#b-f5c842)"/><line x1="522" y1="319" x2="596" y2="319" stroke="#f5c842" stroke-width="2" stroke-linecap="round" marker-end="url(#a-f5c842)" marker-start="url(#b-f5c842)"/><rect x="40" y="372" width="920" height="74" rx="10" fill="#161a21" stroke="#2c313a" stroke-width="1" stroke-dasharray="5 4"/><text x="60" y="398" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e5e7eb" text-anchor="start">Rollen sind pro Bus frei konfigurierbar (Master / Slave, Slave-ID, Baudrate) — der Selbsttest im Tab &quot;Mod RTU&quot; verdrahtet</text><text x="60" y="420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e5e7eb" text-anchor="start">A-TX→B-RX und A-RX→B-TX und prüft, ob der eigene Slave dem eigenen Master antwortet.</text></svg>
