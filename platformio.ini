; Deye-Display -- Build configuration
; ====================================
; Hardware: GUITION JC4880P443C
;   * ESP32-P4 main CPU (+ ESP32-C6 for WiFi6/BLE)
;   * 4.3" IPS panel, 480x800, MIPI-DSI
;   * GT911 capacitive touch (I2C)
;   * 32 MB PSRAM, 16 MB flash
; Framework: pure ESP-IDF
;
; Build/Flash (firmware + filesystem in ONE invocation, so the shared build
; number stays in lockstep -- the pre-build hook bumps the counter once per
; `pio run` regardless of how many targets follow):
;     pio run -e guition-p4 -t upload -t uploadfs -t monitor

[platformio]
src_dir = main

[env:guition-p4]
platform                = https://github.com/pioarduino/platform-espressif32.git
board                   = esp32-p4
framework               = espidf
board_upload.flash_size = 16MB
board_build.flash_size  = 16MB
board_build.partitions  = partitions.csv
board_build.filesystem  = spiffs
monitor_speed           = 115200
monitor_filters         = esp32_exception_decoder, time

; Shared build counter: bumps version.json and regenerates main/build_info.h
; + data/build.txt before every build (see scripts/build_number.py). The
; data/ dir is packed into the SPIFFS "storage" partition by CMake
; (spiffs_create_partition_image ... FLASH_IN_PROJECT) and flashed together
; with the app, so firmware, filesystem and UI always share one build number.
extra_scripts           =
    pre:scripts/build_number.py
    pre:scripts/fs_image.py
