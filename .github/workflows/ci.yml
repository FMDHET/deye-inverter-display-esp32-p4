name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Fast feedback: no toolchain download, no network beyond the checkout.
  host-tests:
    name: Host-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make -C test
        run: make -C test

  # The real build. Kept separate so a broken firmware build never hides a
  # failing test, and vice versa.
  #
  # This job used to be continue-on-error, because `platform` followed the git
  # HEAD of pioarduino and could go red without a line changing here. It is
  # pinned to a release tag now (platformio.ini), so a red build means
  # something in THIS repository broke, and the job counts.
  firmware:
    name: Firmware bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PlatformIO-Zwischenspeicher
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'main/idf_component.yml') }}
          restore-keys: pio-${{ runner.os }}-
      - name: PlatformIO installieren
        run: pip install --upgrade platformio
      - name: Bauen
        run: pio run -e guition-p4
      # The point of pinning: what the pinned platform resolves must be what is
      # committed. If a build rewrites the lock file, the two have drifted and
      # somebody has to look -- silently building against something else is
      # exactly what the pin is meant to prevent.
      - name: dependencies.lock passt zum festgenagelten Stand
        run: git diff --exit-code -- dependencies.lock
      - name: Groesse und Artefakte
        if: always()
        run: |
          ls -l .pio/build/guition-p4/firmware.bin || true
          cat version.json
