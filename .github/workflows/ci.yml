name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Fast feedback: no toolchain download, no network beyond the checkout.
  host-tests:
    name: Host-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make -C test
        run: make -C test

  # The real build, natively with idf.py inside Espressif's own IDF image.
  # Kept separate so a broken firmware build never hides a failing test, and
  # vice versa. The IDF version is pinned here AND checked by CMakeLists.txt
  # (DEYE_IDF_VERSION) -- raise both together.
  firmware:
    name: Firmware bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bauen (ESP-IDF v5.5.5, esp32p4)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32p4
          command: idf.py build
      # The point of pinning: what the pinned IDF resolves must be what is
      # committed. If a build rewrites the lock file, the two have drifted and
      # somebody has to look -- silently building against something else is
      # exactly what the pin is meant to prevent. The container runs as root,
      # so mark the checkout safe before asking git.
      - name: dependencies.lock passt zum festgenagelten Stand
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code -- dependencies.lock
      - name: Groesse und Artefakte
        if: always()
        run: |
          ls -l build/deye_display.bin build/storage.bin || true
          cat version.json
      - name: Binaries aufbewahren
        uses: actions/upload-artifact@v4
        with:
          name: deye-display-firmware
          path: |
            build/deye_display.bin
            build/deye_display.elf
            build/storage.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          if-no-files-found: warn
