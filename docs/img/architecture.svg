ye</text><rect x="376" y="338" width="298" height="34" rx="8" fill="#161a21" stroke="#2c313a" stroke-width="1"/><text x="390" y="360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e5e7eb" text-anchor="start">MQTT · SNTP · WireGuard (über C6)</text><rect x="376" y="378" width="298" height="34" rx="8" fill="#161a21" stroke="#2c313a" stroke-width="1"/><text x="390" y="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#e5e7eb" text-anchor="start">NVS — Geräte, Netze, Sollwerte</text><text x="750" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#9aa0a8" text-anchor="start">Modbus-RTU (RS485)</text><rect x="750" y="128" width="280" height="146" rx="10" fill="#161a21" stroke="#34c9b9" stroke-width="2"/><text x="890" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#34c9b9" text-anchor="middle">Deye SG04LP3</text><text x="890" y="180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#9aa0a8" text-anchor="middle">Hybrid-Wechselrichter + Akku</text><rect x="766" y="196" width="248" height="30" rx="8" fill="#1f2329" stroke="#2c313a" stroke-width="1"/><text x="778" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#e5e7eb" text-anchor="start">Modbus-Port  →  ESP ist Master</text><rect x="766" y="232" width="248" height="30" rx="8" fill="#1f2329" stroke="#2c313a" stroke-width="1"/><text x="778" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-